[pytest]
pythonpath = .
testpaths = tests
# INFO: Warning filters turn selected warnings into test failures, so regressions surface in CI:
#   - DeprecationWarning / FutureWarning raised from our own code (module "core"), e.g. pandas
#     deprecations after the pandas 3 migration. Warnings raised inside third-party code are not affected.
#   - StarletteDeprecationWarning: starlette.testclient must use httpx2 (requirements-dev.txt), not httpx.
filterwarnings =
    error::DeprecationWarning:core
    error::FutureWarning:core
    error::starlette.exceptions.StarletteDeprecationWarning
