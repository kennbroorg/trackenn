name: Cross-Platform Package Release

on:
  push:
    tags:
      - 'v*'

env:
  FRONTEND_VERSION: latest

jobs:
  linux-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install cx_Freeze
        run: pip install cx_Freeze==8.7.2

      - name: Download frontend release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          repo="kennbroorg/trackenn"
          if [ "${FRONTEND_VERSION}" = "latest" ]; then
            tag="frontend-latest"
            asset="frontend-dist-latest.tar.gz"
          else
            tag="frontend-${FRONTEND_VERSION}"
            asset="frontend-dist-${tag}.tar.gz"
          fi
          echo ">>> Downloading frontend asset ${asset} from release ${tag}"
          gh release download "${tag}" --repo "${repo}" --pattern "${asset}" --output frontend.tar.gz
          mkdir -p front
          tar -xzf frontend.tar.gz -C front
          test -f front/index.html || { echo "ERROR: ${asset} has no index.html at its root"; exit 1; }
          test -f front/assets/config.json && { echo "ERROR: ${asset} must not ship assets/config.json (native/binary front defaults to //127.0.0.1:5000)"; exit 1; } || true

      - name: Freeze Python Script
        run: python setup.py build
          # run: cxfreeze -c app.py --target-dir trackenn --target-name trackenn

      - name: Zip Distribution Directory
        run: zip -r trackenn-linux.zip trackenn/

      - name: Upload Linux Asset
        uses: actions/upload-artifact@v7
        with:
          name: trackenn-linux.zip
          path: trackenn-linux.zip

  windows-build:
    runs-on: windows-latest
    needs: linux-build
    steps:
      - uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install cx_Freeze
        run: pip install cx_Freeze==8.7.2

      - name: Download frontend release asset
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          repo="kennbroorg/trackenn"
          if [ "${FRONTEND_VERSION}" = "latest" ]; then
            tag="frontend-latest"
            asset="frontend-dist-latest.tar.gz"
          else
            tag="frontend-${FRONTEND_VERSION}"
            asset="frontend-dist-${tag}.tar.gz"
          fi
          echo ">>> Downloading frontend asset ${asset} from release ${tag}"
          gh release download "${tag}" --repo "${repo}" --pattern "${asset}" --output frontend.tar.gz
          mkdir -p front
          tar -xzf frontend.tar.gz -C front
          test -f front/index.html || { echo "ERROR: ${asset} has no index.html at its root"; exit 1; }
          test -f front/assets/config.json && { echo "ERROR: ${asset} must not ship assets/config.json (native/binary front defaults to //127.0.0.1:5000)"; exit 1; } || true

      - name: Freeze Python Script
        run: python setup.py build
          # run: cxfreeze -c app.py --target-dir trackenn --target-name trackenn

      - name: Zip Distribution Directory
        run: Compress-Archive -Path trackenn/* -DestinationPath trackenn-windows.zip

      - name: Upload Windows Asset
        uses: actions/upload-artifact@v7
        with:
          name: trackenn-windows.zip
          path: trackenn-windows.zip

  create-release:
    needs: [linux-build, windows-build]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - name: Download Artifacts
        uses: actions/download-artifact@v7

      - name: List files in the current directory
        run: ls -la

      # INFO: actions/create-release@v1/upload-release-asset@v1 are deprecated
      #       (save-state/set-output shutdown); gh does create+upload in one step.
      - name: Create Release and Upload Assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "${GITHUB_REF_NAME}" \
            --title "Release ${GITHUB_REF_NAME}" \
            --verify-tag \
            "trackenn-linux.zip/trackenn-linux.zip" \
            "trackenn-windows.zip/trackenn-windows.zip"

