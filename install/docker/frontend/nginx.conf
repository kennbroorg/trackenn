##############################################################################
# nginx.conf — trackenn frontend
#
# Serves the Angular SPA and proxies /api/* → backend:5000 (prefix stripped:
# /api/stream-data-info → http://backend:5000/stream-data-info).
#
# The API streams Server-Sent Events (/stream-data-info, /stream-data-checking):
# buffering is off and the read timeout is long, otherwise nginx holds the
# events until the stream ends and cuts long collections.
##############################################################################

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # INFO: add_header in a location drops the server-level ones, every location includes the snippet
    include /etc/nginx/snippets/security-headers.conf;

    gzip              on;
    gzip_vary         on;
    gzip_min_length   1024;
    gzip_proxied      any;
    gzip_comp_level   6;
    # INFO: text/event-stream is left out on purpose, gzip would buffer the events
    gzip_types
        text/plain
        text/css
        application/json
        application/javascript
        image/svg+xml;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        proxy_pass         http://backend:5000/;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # INFO: Server-Sent Events
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 10s;
    }

    # INFO: Runtime config of the front, never cached so a new image takes effect at once
    location = /assets/config.json {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-store" always;
    }

    # INFO: Angular hashes bundle names, a long expiry is safe for them
    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|woff|woff2|ttf|eot)$ {
        include /etc/nginx/snippets/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        access_log off;
    }

    location = /health {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }
}
