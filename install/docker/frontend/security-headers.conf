add_header X-Frame-Options        "SAMEORIGIN"                      always;
add_header X-Content-Type-Options "nosniff"                         always;
add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
# INFO: The Angular bundle is served same-origin and only calls /api/* (same-origin proxy), so
#       default-src 'self' covers scripts/styles/xhr; 'unsafe-inline' is needed for Angular's
#       inlined critical CSS (no nonce/hash wiring here) and the force-graph canvas/webgl layer.
add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'self'" always;
